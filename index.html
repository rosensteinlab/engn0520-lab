<title>ENGN0520 lab checkoff</title>
<script>
  // The ONE line to change if the Apps Script web app URL ever changes.
  // Paste the "Web app URL" from Deploy > Manage deployments (it ends in /exec).

  // Forward to the app, keeping ?b=0137K from the sticker.

<body style="font-family: sans-serif; padding: 24px;">
  <p>Opening the lab checkoff app&hellip;</p>
  <p><a id="go" href="#">Tap here if nothing happens.</a></p>
